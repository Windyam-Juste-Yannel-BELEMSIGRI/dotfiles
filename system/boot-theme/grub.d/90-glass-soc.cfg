# setup-sway / glass-soc — thème GRUB + couleurs TTY (sourcé par update-grub après /etc/default/grub)
# Retrait : ~/dotfiles/rollback.sh boot
GRUB_THEME=/boot/grub/themes/glass-soc/theme.txt
GRUB_GFXMODE=2560x1600x32,auto
GRUB_TERMINAL_OUTPUT=gfxterm
# palette 16 couleurs de la console = palette foot
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} vt.default_red=0x1c,0xb0,0x8f,0xd8,0x7a,0xb0,0x7d,0xa8,0x4a,0xc0,0xa0,0xe8,0x8a,0xc0,0x8d,0xe8 vt.default_grn=0x1c,0x60,0xb0,0xa6,0x9d,0x90,0xd3,0xa8,0x4a,0x70,0xc0,0xb8,0xad,0xa0,0xe3,0xe8 vt.default_blu=0x1e,0x60,0x90,0x57,0xc0,0xc0,0xc0,0xae,0x50,0x70,0xa0,0x67,0xd0,0xd0,0xd0,0xec"
