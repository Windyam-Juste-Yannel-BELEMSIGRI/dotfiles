# setup-sway / glass-soc — thème GRUB + couleurs TTY (sourcé par update-grub après /etc/default/grub)
# Retrait : ~/dotfiles/rollback.sh boot
GRUB_THEME=/boot/grub/themes/glass-soc/theme.txt
GRUB_GFXMODE=2560x1600x32,auto
GRUB_TERMINAL_OUTPUT=gfxterm
# palette 16 couleurs de la console = palette foot (« SOC Matrix »)
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} vt.default_red=0x0b,0xff,0x00,0xff,0x4f,0xb3,0x00,0xc5,0x4a,0xff,0x5c,0xff,0x82,0xcd,0x6c,0xff vt.default_grn=0x0f,0x53,0xff,0xb0,0xc3,0x88,0xe5,0xd1,0x5a,0x7a,0xff,0xcb,0xd8,0xb5,0xf0,0xff vt.default_blu=0x14,0x70,0x9c,0x00,0xf7,0xff,0xff,0xde,0x6a,0x90,0xc0,0x4d,0xff,0xff,0xff,0xff"
