# ── foot "glass // SOC" ──────────────────────────────────────────────────
# Palette « SOC Matrix » du portfolio ; police Nerd Font pour les icônes.
# Foot 1.21 (Debian 13) : section [colors]. Le dépôt d’origine utilisait
# [colors-dark], qui n’existe qu’à partir de foot 1.22 → adapté.
[main]
font=JetBrainsMono Nerd Font:size=11
font-bold=JetBrainsMono Nerd Font:weight=bold:size=11
pad=12x12
dpi-aware=yes
term=foot
title=foot

[bell]
urgent=yes
visual=yes

[scrollback]
lines=20000
indicator-position=relative

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[cursor]
style=beam
blink=yes
color=0b0f14 00ff9c

[mouse]
hide-when-typing=yes

[colors]
# Schéma « SOC Matrix » : exactement celui de Windows Terminal (windows-geek-theme).
alpha=0.88
background=0b0f14
foreground=c5d1de
selection-foreground=c5d1de
selection-background=1b3a33
urls=00e5ff

regular0=0b0f14
regular1=ff5370
regular2=00ff9c
regular3=ffb000
regular4=4fc3f7
regular5=b388ff
regular6=00e5ff
regular7=c5d1de

bright0=4a5a6a
bright1=ff7a90
bright2=5cffc0
bright3=ffcb4d
bright4=82d8ff
bright5=cdb5ff
bright6=6cf0ff
bright7=ffffff

[key-bindings]
# Ctrl+Shift+O : ouvrir une URL visible (mode url) — Ctrl+Shift+U reste la saisie Unicode
show-urls-launch=Control+Shift+o
search-start=Control+Shift+f
