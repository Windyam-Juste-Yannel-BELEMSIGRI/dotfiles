# ── foot "glass // SOC" ──────────────────────────────────────────────────
# Palette d'origine conservée (dotfiles) ; police Nerd Font pour les icônes.
# Foot 1.21 (Debian 13) : section [colors]. Le dépôt d’origine utilisait
# [colors-dark], qui n’existe qu’à partir de foot 1.22 → adapté.
[main]
font=JetBrainsMono Nerd Font:size=11
font-bold=JetBrainsMono Nerd Font:weight=bold:size=11
pad=12x12
dpi-aware=yes
term=foot
title=foot

[bell]
urgent=yes
visual=yes

[scrollback]
lines=20000
indicator-position=relative

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[cursor]
style=beam
blink=yes
color=1c1c1e 7dd3c0

[mouse]
hide-when-typing=yes

[colors]
alpha=0.88
background=1c1c1e
foreground=e8e8ec
selection-foreground=1c1c1e
selection-background=7dd3c0
urls=7dd3c0

regular0=1c1c1e
regular1=b06060
regular2=8fb090
regular3=d8a657
regular4=7a9dc0
regular5=b090c0
regular6=7dd3c0
regular7=a8a8ae

bright0=4a4a50
bright1=c07070
bright2=a0c0a0
bright3=e8b867
bright4=8aadd0
bright5=c0a0d0
bright6=8de3d0
bright7=e8e8ec

[key-bindings]
# Ctrl+Shift+O : ouvrir une URL visible (mode url) — Ctrl+Shift+U reste la saisie Unicode
show-urls-launch=Control+Shift+o
search-start=Control+Shift+f
