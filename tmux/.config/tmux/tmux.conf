# ── tmux 3.5 "glass // SOC" ──────────────────────────────────────────────
# Préfixe : Ctrl+a (Ctrl+b conservé en secondaire)
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,xterm*:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g mode-keys vi

# Raccourcis
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf rechargé"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5
bind S choose-session
bind X confirm-before -p "fermer la session #S ? (y/n)" kill-session
# copie vi → presse-papiers Wayland
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Thème
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1c1c1e,fg=#a8a8ae"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#7dd3c0,fg=#1c1c1e,bold]  #S #[bg=#1c1c1e,fg=#7dd3c0] "
set -g status-right "#[fg=#4a4a50]│ #[fg=#a8a8ae]#{?client_prefix,#[fg=#d8a657]PREFIX ,}#H #[fg=#4a4a50]│ #[fg=#a8a8ae]%H:%M #[fg=#4a4a50]│ #[fg=#7dd3c0]UTC #(date -u +%%H:%%M) "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=#2a2a2e,fg=#7dd3c0,bold] #I #W "
set -g pane-border-style "fg=#3a3a40"
set -g pane-active-border-style "fg=#7dd3c0"
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=#7dd3c0],#[fg=#a8a8ae]}#{pane_index}:#{?pane_title,#{pane_title},#{pane_current_command}} "
set -g message-style "bg=#2a2a2e,fg=#e8e8ec"
set -g mode-style "bg=#7dd3c0,fg=#1c1c1e"
set -g display-panes-active-colour "#7dd3c0"
set -g display-panes-colour "#4a4a50"
setw -g clock-mode-colour "#7dd3c0"
