# starship 1.22 — "glass // SOC"
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
command_timeout = 800
palette = "glass"

# Même prompt que sous Windows (oh-my-posh « soc-matrix ») :
#   ┌─[user@host]─[ chemin]─[ branche état]─[ venv]        [ code] [ durée] [ heure]
#   └─❯
format = """
[┌─\\[](cyan)$username$hostname[\\]](cyan)$directory$git_branch$git_status$python$c$rust$golang$docker_context
[└─](accent)$jobs$character"""
right_format = "$status$cmd_duration$time"

[palettes.glass]
bg = "#0b0f14"
surface = "#121821"
overlay = "#1e2632"
fg = "#c5d1de"
muted = "#7d8898"
dim = "#5c6b7a"
accent = "#00ff9c"
cyan = "#00e5ff"
red = "#ff5370"
green = "#00ff9c"
yellow = "#ffb000"
amber = "#ffb000"
blue = "#4fc3f7"
purple = "#b388ff"

[username]
show_always = true
style_user = "cyan"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
ssh_symbol = " 󰣀"
style = "cyan"
format = "[@$hostname$ssh_symbol]($style)"

[directory]
style = "accent"
read_only = " 󰌾"
truncation_length = 3
truncation_symbol = "…/"
format = "[─\\[ $path$read_only\\]]($style)"

[git_branch]
symbol = " "
style = "cyan"
format = "[─\\[$symbol$branch]($style)"

# Fait suite à git_branch (qui laisse le crochet ouvert) : état en ambre, puis fermeture.
[git_status]
style = "amber"
format = "([ $all_status$ahead_behind]($style))[\\]](cyan)"

[python]
symbol = " "
style = "purple"
format = "[─\\[$symbol($virtualenv )$version\\]]($style)"

[c]
style = "blue"
format = "[─\\[$symbol($version)\\]]($style)"

[rust]
style = "blue"
format = "[─\\[$symbol($version)\\]]($style)"

[golang]
style = "blue"
format = "[─\\[$symbol($version)\\]]($style)"

[docker_context]
style = "blue"
format = "[─\\[$symbol$context\\]]($style)"

[cmd_duration]
min_time = 2000
style = "amber"
format = "[\\[ $duration\\]]($style) "

[status]
disabled = false
symbol = " "
style = "red"
format = "[\\[$symbol$status\\]]($style) "

[jobs]
symbol = "󰯽 "
style = "amber"

[character]
success_symbol = "[❯](bold accent)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold cyan)"

[time]
disabled = false
time_format = "%H:%M:%S"
style = "amber"
format = "[\\[ $time\\]]($style)"
