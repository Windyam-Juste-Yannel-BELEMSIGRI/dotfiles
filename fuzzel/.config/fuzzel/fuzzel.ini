# ── fuzzel "glass // SOC" (remplace wofi du thème d'origine) ─────────────
# Couleurs au format RRGGBBAA. Utilisé comme lanceur ET comme menu (--dmenu)
# par les scripts wifi-menu, bt-menu, power-menu, screenshot-menu, clip-menu.
[main]
font=JetBrainsMono Nerd Font:size=12
prompt="❯ "
icon-theme=Papirus-Dark
icons-enabled=yes
terminal=foot -e
layer=overlay
width=48
lines=12
horizontal-pad=20
vertical-pad=14
inner-pad=8
line-height=22
letter-spacing=0
fields=filename,name,generic,keywords
match-mode=fzf

[colors]
background=1c1c1ef0
text=e8e8ecff
prompt=7dd3c0ff
placeholder=a8a8aeff
input=e8e8ecff
match=7dd3c0ff
selection=2a2a2eff
selection-text=e8e8ecff
selection-match=8de3d0ff
border=7dd3c080
counter=a8a8aeff

[border]
width=1
radius=12

[dmenu]
exit-immediately-if-empty=yes
