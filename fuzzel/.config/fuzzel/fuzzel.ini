# ── fuzzel "glass // SOC" (remplace wofi du thème d'origine) ─────────────
# Couleurs au format RRGGBBAA. Utilisé comme lanceur ET comme menu (--dmenu)
# par les scripts wifi-menu, bt-menu, power-menu, screenshot-menu, clip-menu.
[main]
font=JetBrainsMono Nerd Font:size=12
prompt="❯ "
icon-theme=Papirus-Dark
icons-enabled=yes
terminal=foot -e
layer=overlay
width=48
lines=12
horizontal-pad=20
vertical-pad=14
inner-pad=8
line-height=22
letter-spacing=0
fields=filename,name,generic,keywords
match-mode=fzf
# Ne pas se fermer quand le curseur passe sur une fenêtre (focus_follows_mouse
# de Sway retirait le focus clavier → les menus se refermaient au moindre
# mouvement du touchpad). Fermeture : Échap, sélection, ou re-clic waybar.
exit-on-keyboard-focus-loss=no

[colors]
background=0b0f14f0
text=c5d1deff
prompt=00ff9cff
placeholder=7d8898ff
input=c5d1deff
match=00ff9cff
selection=1b3a33ff
selection-text=c5d1deff
selection-match=00e5ffff
border=00ff9c55
counter=7d8898ff

[border]
width=1
radius=10

[dmenu]
exit-immediately-if-empty=yes
