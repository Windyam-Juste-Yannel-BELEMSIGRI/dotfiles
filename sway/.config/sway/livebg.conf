# ── livebg « glass // SOC » : fond animé (graphe réseau du portfolio) ────
# Pris en compte au redémarrage : livebg off && livebg on
[general]
# images par seconde (secteur / batterie)
fps           = 24
battery_fps   = 12
# un nœud pour N pixels d'écran, plafonné
density       = 24000
max_nodes     = 170
# distance maximale d'un lien (px) et vitesse maximale d'un nœud (px/s)
link_distance = 205
speed         = 9
max_packets   = 24
# intensité générale (0.0 discret → 1.0 marqué)
opacity       = 1.0
# épaisseur des liens et taille minimale des nœuds (px)
line_width    = 1.3
node_radius   = 1.8

[colors]
line      = #a8a8ae
node      = #a8a8ae
packet    = #7dd3c0
highlight = #8de3d0
