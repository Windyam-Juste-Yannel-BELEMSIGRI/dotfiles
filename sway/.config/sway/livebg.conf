# ── livebg « glass // SOC » : fond animé (graphe réseau du portfolio) ────
# Pris en compte au redémarrage : livebg off && livebg on
[general]
# moteur de rendu : auto (OpenGL sur la carte graphique, sinon Cairo), gl, cairo
renderer      = auto
# images par seconde (secteur / batterie). En OpenGL, tout le graphe suit cette cadence.
fps           = 24
battery_fps   = 12
# Rendu Cairo seulement (repli sans OpenGL) : images par seconde du graphe lui-même.
# Il dérive lentement : 8 suffisent, et c'est lui qui coûte (tracé plein écran sur le processeur).
net_fps         = 8
battery_net_fps = 5
# un nœud pour N pixels d'écran, plafonné
density       = 24000
max_nodes     = 170
# distance maximale d'un lien (px) et vitesse maximale d'un nœud (px/s)
link_distance = 205
speed         = 9
max_packets   = 24
# intensité générale (0.0 discret → 1.0 marqué)
opacity       = 1.0
# épaisseur des liens et taille minimale des nœuds (px)
line_width    = 1.3
node_radius   = 1.8

[colors]
line      = #7d8898
node      = #7d8898
packet    = #00e5ff
highlight = #00ff9c

# Carte « status.json » (celle du portfolio) en bas à droite du bureau
[card]
enabled = yes
# phrases tapées à la machine, séparées par |
words   = futur SOC analyst | data engineer en devenir | logs → pipelines → détections | blue team · linux · réseaux
# distance aux bords de l'écran (px)
margin_right  = 84
margin_bottom = 96
