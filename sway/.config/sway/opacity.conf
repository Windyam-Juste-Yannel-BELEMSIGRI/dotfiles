# ── sway-opacity « glass // SOC » ────────────────────────────────────────
# Opacité 0.0 (invisible) → 1.0 (opaque). Pris en compte au prochain
# changement de focus (ou : sway-opacity on).
[general]
focused    = 0.95
unfocused  = 0.86
# Fenêtre flottante active : opaque, car sans flou le texte situé derrière resterait lisible
floating_focused = 1.0
fade_steps = 5
fade_ms    = 70

# motif (regex sur app_id / classe) = <active> <inactive>   — premier motif gagnant
[rules]
# foot gère déjà sa propre transparence (alpha=0.88) : on n'estompe que l'inactif
^(foot|footclient|floating-term|soc-dashboard|cava-widget)$ = 1.0 0.90
# Lecture longue : quasi opaque quand active
(qutebrowser|firefox|chromium|code|zathura|wireshark) = 0.98 0.90
# Image / vidéo / capture / mot de passe : jamais transparent
(mpv|vlc|imv|swappy|keepassxc|virtualbox|sudo-askpass) = 1.0 1.0
