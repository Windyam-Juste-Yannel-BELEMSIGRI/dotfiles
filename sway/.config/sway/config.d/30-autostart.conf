# ── Session ──────────────────────────────────────────────────────────────
# Tous les démons (waybar, mako, swayidle, wlsunset, kanshi, cliphist,
# polkit, fond d'écran) sont des services systemd --user rattachés à
# sway-session.target → redémarrage auto, logs via journalctl --user.
exec_always systemctl --user start sway-session.target
# Arrêt propre des services à la sortie de Sway
exec swaymsg -t subscribe '["shutdown"]' && systemctl --user stop sway-session.target

# GTK/libadwaita : thème sombre, icônes, curseur, polices (gsettings/dconf)
exec_always ~/.local/bin/theme-apply
