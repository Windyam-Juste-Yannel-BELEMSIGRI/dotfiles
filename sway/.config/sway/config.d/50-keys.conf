# ── Raccourcis (clavier QWERTY US) ───────────────────────────────────────
# Aide interactive : $mod+F1 (keys-help lit ce fichier, lignes "bindsym").
# Convention : $mod = touche Super/Windows. Une ligne "#? description"
# juste au-dessus d’un bindsym sert de libellé à keys-help.

# Essentiels
#? terminal
bindsym $mod+Return       exec $term
#? terminal flottant
bindsym $mod+Shift+Return exec $term --app-id=floating-term
#? lanceur d'applications
bindsym $mod+d            exec $menu
#? fermer la fenêtre
bindsym $mod+Shift+q      kill
#? recharger sway
bindsym $mod+Shift+c      reload
#? aide raccourcis
bindsym $mod+F1           exec $bin/keys-help
#? gestionnaire de fichiers
bindsym $mod+o            exec thunar

# Session / alimentation
#? menu alimentation
bindsym $mod+Shift+e      exec $bin/power-menu
#? menu alimentation
bindsym $mod+Escape       exec $bin/power-menu
#? verrouiller
bindsym $mod+Ctrl+l       exec $bin/lock-glitch

# Menus réseau / bluetooth / audio / presse-papiers
#? menu Wi-Fi
bindsym $mod+Shift+n      exec $bin/wifi-menu
#? menu Bluetooth
bindsym $mod+Shift+b      exec $bin/bt-menu
#? mixeur audio
bindsym $mod+Shift+a      exec pavucontrol
#? historique presse-papiers
bindsym $mod+v            exec $bin/clip-menu
#? visualiseur audio cava
bindsym $mod+Shift+v      exec $term --app-id=cava-widget cava

# Notifications (mako)
#? fermer la notification
bindsym $mod+n            exec makoctl dismiss
#? fermer toutes les notifications
bindsym $mod+Ctrl+n       exec makoctl dismiss --all
#? rappeler la dernière notification
bindsym $mod+Alt+n        exec makoctl restore
#? ne pas déranger on/off
bindsym $mod+Shift+m      exec $bin/dnd-toggle

# Captures / enregistrement
#? menu capture
bindsym Print             exec $bin/screenshot-menu
#? zone → presse-papiers
bindsym Shift+Print       exec $bin/screenshot-menu region-copy
#? écran → fichier
bindsym $mod+Print        exec $bin/screenshot-menu full-save
#? zone → swappy
bindsym $mod+Shift+s      exec $bin/screenshot-menu region-edit
#? enregistrement écran on/off
bindsym $mod+Shift+r      exec $bin/screenshot-menu record-toggle

# Outils SOC / système (terminal)
#? tableau de bord SOC (tmux)
bindsym $mod+x            exec $term --app-id=soc-dashboard $bin/soc-dashboard
#? sysmon
bindsym $mod+i            exec $term --app-id=floating-term $bin/sysmon
#? netwatch
bindsym $mod+Shift+i      exec $term --app-id=floating-term $bin/netwatch
#? btop
bindsym $mod+Shift+t      exec $term --app-id=floating-term btop

# Énergie / confort
#? profil énergie/ventilo suivant
bindsym $mod+p            exec $bin/power-profile cycle
#? éclairage nocturne on/off
bindsym $mod+Shift+z      exec $bin/nightlight toggle
#? fond d'écran suivant
bindsym $mod+Shift+w      exec $bin/set-wallpaper next

# Touches matérielles (wpctl / brightnessctl / playerctl) + OSD
#? volume +
bindsym --locked XF86AudioRaiseVolume  exec $bin/osd volume-up
#? volume -
bindsym --locked XF86AudioLowerVolume  exec $bin/osd volume-down
#? muet
bindsym --locked XF86AudioMute         exec $bin/osd volume-mute
#? micro muet
bindsym --locked XF86AudioMicMute      exec $bin/osd mic-mute
#? luminosité +
bindsym --locked XF86MonBrightnessUp   exec $bin/osd bright-up
#? luminosité -
bindsym --locked XF86MonBrightnessDown exec $bin/osd bright-down
#? rétro-éclairage clavier +
bindsym --locked XF86KbdBrightnessUp   exec $bin/osd kbd-up
#? rétro-éclairage clavier -
bindsym --locked XF86KbdBrightnessDown exec $bin/osd kbd-down
#? lecture/pause
bindsym --locked XF86AudioPlay         exec playerctl play-pause
#? lecture/pause
bindsym --locked XF86AudioPause        exec playerctl play-pause
#? piste suivante
bindsym --locked XF86AudioNext         exec playerctl next
#? piste précédente
bindsym --locked XF86AudioPrev         exec playerctl previous
#? pavé tactile on/off
bindsym XF86TouchpadToggle             input type:touchpad events toggle enabled disabled
# Touches ASUS ROG (Fn+F5 ventilateur / touche Armoury) → profil énergie.
# Les keysyms exacts se vérifient avec `wev` (voir docs/RAPPORT.md).
#? (ASUS) profil suivant
bindsym XF86Launch4                    exec $bin/power-profile cycle
#? (ASUS) profil suivant
bindsym XF86Launch1                    exec $bin/power-profile cycle

# Focus / déplacement (vim + flèches)
bindsym $mod+$left  focus left
bindsym $mod+$down  focus down
bindsym $mod+$up    focus up
bindsym $mod+$right focus right
bindsym $mod+Left   focus left
bindsym $mod+Down   focus down
bindsym $mod+Up     focus up
bindsym $mod+Right  focus right
bindsym $mod+Shift+$left  move left
bindsym $mod+Shift+$down  move down
bindsym $mod+Shift+$up    move up
bindsym $mod+Shift+$right move right
bindsym $mod+Shift+Left   move left
bindsym $mod+Shift+Down   move down
bindsym $mod+Shift+Up     move up
bindsym $mod+Shift+Right  move right

# Espaces de travail 1–10
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10
#? espace précédent
bindsym $mod+Tab        workspace back_and_forth
#? espace suivant
bindsym $mod+Ctrl+Right exec $bin/ws-switch next
#? espace précédent
bindsym $mod+Ctrl+Left  exec $bin/ws-switch prev
# Glisser à 4 doigts (natural_scroll : doigts vers la gauche = espace suivant)
bindgesture swipe:4:left  exec $bin/ws-switch next
bindgesture swipe:4:right exec $bin/ws-switch prev
bindgesture swipe:4:up    exec $bin/ws-switch prev
bindgesture swipe:4:down  exec $bin/ws-switch next
# Glisser à 3 doigts vers le haut / bas : plein écran on/off
bindgesture swipe:3:up   fullscreen enable
bindgesture swipe:3:down fullscreen disable

# Mise en page
#? découpe horizontale
bindsym $mod+b splith
#? découpe verticale
bindsym $mod+g splitv
#? disposition empilée
bindsym $mod+s layout stacking
#? disposition onglets
bindsym $mod+w layout tabbed
#? alterner découpe
bindsym $mod+e layout toggle split
#? plein écran
bindsym $mod+f fullscreen
#? flottant on/off
bindsym $mod+Shift+space floating toggle
#? focus tuilé/flottant
bindsym $mod+space focus mode_toggle
#? focus parent
bindsym $mod+a focus parent
#? envoyer au scratchpad
bindsym $mod+Shift+minus move scratchpad
#? afficher le scratchpad
bindsym $mod+minus scratchpad show
floating_modifier $mod normal

# Redimensionnement
#? mode redimensionnement
bindsym $mod+r mode "resize"
mode "resize" {
    bindsym $left  resize shrink width 20px
    bindsym $down  resize grow height 20px
    bindsym $up    resize shrink height 20px
    bindsym $right resize grow width 20px
    bindsym Left   resize shrink width 20px
    bindsym Down   resize grow height 20px
    bindsym Up     resize shrink height 20px
    bindsym Right  resize grow width 20px
    bindsym Return mode "default"
    bindsym Escape mode "default"
}

# Mode passthrough (VM, RDP, sway imbriqué) : raccourcis désactivés
#? mode passthrough on/off
bindsym $mod+Shift+p mode "passthrough"
mode "passthrough" {
    bindsym $mod+Shift+p mode "default"
}

# Agenda / transparence / outils SOC & data (phase 14)
#? agenda (interface)
bindsym $mod+c            exec $bin/agenda-gui
#? agenda (menu rapide)
bindsym $mod+Ctrl+c       exec $bin/agenda menu
#? transparence des fenêtres : activer / couper
bindsym $mod+Shift+o      exec $bin/sway-opacity toggle
#? recherche d'indicateur (IP, domaine, hash, CVE) depuis le presse-papiers
bindsym $mod+q            exec $bin/ioc --menu
#? mode de travail (SOC / data / étude)
bindsym $mod+m            exec $bin/workmode
#? fond d'écran animé : activer / couper
bindsym $mod+Ctrl+w       exec $bin/livebg toggle
