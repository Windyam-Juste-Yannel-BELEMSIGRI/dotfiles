# ── Capot ────────────────────────────────────────────────────────────────
# Écran externe présent : capot fermé → eDP-1 désactivé (mode station).
# Sans écran externe, logind gère la suspension (HandleLidSwitch par défaut).
bindswitch --reload --locked lid:on  output eDP-1 disable
bindswitch --reload --locked lid:off output eDP-1 enable
