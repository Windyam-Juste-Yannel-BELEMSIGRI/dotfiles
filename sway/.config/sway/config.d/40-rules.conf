# ── Règles de fenêtres ───────────────────────────────────────────────────
for_window [app_id="sudo-askpass"]           floating enable, move position center, sticky enable
for_window [app_id="floating-term"]          floating enable, resize set 1100 700, move position center
for_window [app_id="pavucontrol"]            floating enable, resize set 900 600, move position center
for_window [app_id="blueman-manager"]        floating enable, resize set 800 550, move position center
for_window [app_id="nm-connection-editor"]   floating enable
for_window [app_id="polkit-mate-authentication-agent-1"] floating enable, sticky enable
for_window [app_id="swappy"]                 floating enable
for_window [app_id="cava-widget"]            floating enable, resize set 800 300, move position center, sticky enable
for_window [app_id="thunar" title="^(Copy|Move|Rename|File Operation).*"] floating enable
for_window [window_role="pop-up"]            floating enable
for_window [window_role="dialog"]            floating enable
for_window [window_type="dialog"]            floating enable
for_window [title="(?:Open|Save) (?:File|Folder|As)"] floating enable

# Indicateur visuel des fenêtres XWayland (utile pour le debug)
for_window [shell="xwayland"] title_format "%title  [X]"

# Pas de veille pendant une vidéo plein écran
for_window [app_id=".*"] inhibit_idle fullscreen
for_window [class=".*"]  inhibit_idle fullscreen

# Tableau de bord SOC : espace de travail 9 dédié (pleine largeur)
assign [app_id="soc-dashboard"] workspace number 9
for_window [app_id="soc-dashboard"] focus

# Applications de bureau (phase 13)
for_window [app_id="imv"]                    floating enable, resize set 1400 900, move position center
for_window [app_id="org.keepassxc.KeePassXC"] floating enable, resize set 1100 700, move position center
for_window [title="^Picture.in.[Pp]icture$"] floating enable, sticky enable, resize set 640 360, move position 1880 1180
for_window [class="VirtualBox Manager"]      floating enable, resize set 1300 800, move position center

# Agenda (phase 14) : fenêtre flottante centrée
for_window [app_id="agenda"]                 floating enable, move position center
