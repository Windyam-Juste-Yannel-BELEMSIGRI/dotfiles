# ── Apparence "glass // SOC" ─────────────────────────────────────────────
# Note : blur / shadows / corner_radius / layer_effects du thème d'origine
# sont des options SwayFX (absent de Debian 13) → retirées. La transparence
# du terminal est gérée par foot (alpha) pour garder un texte net.
font pango:JetBrainsMono Nerd Font 10

default_border pixel 2
default_floating_border pixel 2
titlebar_border_thickness 1
titlebar_padding 6 2
# Fenêtres toujours séparées entre elles et décollées des bords, même seules
# (pas de smart_gaps) ; seul le plein écran occupe tout l'écran.
hide_edge_borders none
smart_gaps off

gaps inner 12
gaps outer 2
# Les valeurs ci-dessus ne valent que pour les NOUVEAUX espaces : on les
# applique aussi aux espaces existants à chaque rechargement.
exec_always swaymsg "gaps inner all set 12" && swaymsg "gaps outer all set 2"

# Fenêtre active : liseré vert « matrix » ; les autres : vert très sombre
# (mêmes teintes que GlazeWM côté Windows). L'indicateur de découpe est cyan.
#                       border    bg        text     indicator  child_border
client.focused          $accent   $surface  $fg      $accent2   $accent
client.focused_inactive $edge     $bg       $muted   $edge      $edge
client.unfocused        $edge     $bg       $dim     $edge      $edge
client.urgent           $red      $red      $bg      $red       $red
client.placeholder      $bg       $bg       $fg      $bg        $bg
client.background       $bg

# Transparence : gérée par sway-opacity (93 % fenêtre active, 86 % les autres,
# réglable dans opacity.conf) et par foot pour le terminal (alpha).
