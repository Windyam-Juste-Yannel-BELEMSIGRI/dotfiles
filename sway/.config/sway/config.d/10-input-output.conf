# ── Entrées / sorties ────────────────────────────────────────────────────
# Clavier physique QWERTY US. Pour ajouter une 2e disposition :
#   xkb_layout us,fr  +  xkb_options grp:alt_shift_toggle
input type:keyboard {
    xkb_layout us
    xkb_numlock enabled
    repeat_delay 300
    repeat_rate 40
}

input type:touchpad {
    tap enabled
    natural_scroll enabled
    dwt enabled
    middle_emulation enabled
}

# Fond d'écran : image perso prioritaire, sinon fond généré "glass-soc".
# (le lien "current" est posé par set-wallpaper ; swaybg est lancé par sway)
output * bg ~/.local/share/backgrounds/current fill $bg

# Écran interne ; les écrans externes sont gérés par kanshi.
output eDP-1 adaptive_sync on

# Le curseur suit le thème
seat seat0 xcursor_theme Bibata-Modern-Classic 24
focus_follows_mouse yes
mouse_warping container
